{% extends "base.html" %}
{% block content %}
<h2>Остаток на складе</h2>

<div class="row mb-3">
    <div class="col-md-4">
        <input type="text" id="filterCode" class="form-control" placeholder="Код" oninput="filterStock()">
    </div>
    <div class="col-md-4">
        <input type="text" id="filterName" class="form-control" placeholder="Наименование" oninput="filterStock()">
    </div>
    <div class="col-md-4">
        <a href="/api/export/stock" class="btn btn-outline-success w-100">📥 Скачать остаток в Excel</a>
    </div>
</div>

<div class="card">
    <div class="card-body p-0">
        <table class="table table-sm table-striped table-hover m-0">
            <thead class="table-dark">
                <tr><th>Код</th><th>Наименование</th><th>Артикул</th><th>Кол-во</th><th>Ед.</th></tr>
            </thead>
            <tbody id="stockBody">
                <tr><td colspan="5" class="text-center">Загрузка...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
let allStock = [];
async function loadStock() {
    const response = await fetch('/api/stock');
    allStock = await response.json();
    renderStock(allStock);
}
function renderStock(data) {
    const tbody = document.getElementById('stockBody');
    if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Нет данных</td></tr>';
        return;
    }
    tbody.innerHTML = data.map(s => `
        <tr><td>${s.code}</td><td>${s.name}</td><td>${s.article || ''}</td>
        <td>${s.quantity}</td><td>${s.unit || ''}</td></tr>`).join('');
}
function filterStock() {
    const fCode = document.getElementById('filterCode').value.toLowerCase();
    const fName = document.getElementById('filterName').value.toLowerCase();
    const filtered = allStock.filter(s =>
        s.code.toLowerCase().includes(fCode) && s.name.toLowerCase().includes(fName)
    );
    renderStock(filtered);
}
loadStock();
</script>
{% endblock %}
